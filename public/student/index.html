<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>學生 — 課堂搶答系統</title>
    <link rel="stylesheet" href="/css/base.css" />
  </head>
  <body>
    <div class="page">
      <header class="page-header">
        <h1>學生</h1>
        <a href="/">回首頁</a>
      </header>
      <main id="app">
        <p id="student-status" class="status" role="status">正在載入組別工作階段…</p>
        <button id="student-leave" type="button" hidden>退出目前活動</button>
        <form id="student-join" hidden>
          <label for="student-join-code">活動加入碼</label>
          <input id="student-join-code" autocomplete="off" required />
          <label for="student-name">組名</label>
          <input id="student-name" autocomplete="off" required />
          <button type="submit">加入活動</button>
        </form>
        <section id="student-mode" hidden></section>
        <section id="student-buzzer" hidden></section>
        <section id="student-results" hidden></section>
      </main>
    </div>
    <script type="module" src="/student/mode-info.js"></script>
    <script type="module" src="/student/realtime-buzzer.js"></script>
    <script type="module" src="/student/results-export.js"></script>
    <script type="module" src="/student/activity-groups.js"></script>
  </body>
</html>
