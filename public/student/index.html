<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>學生 — 課堂搶答系統</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/base.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar__inner">
        <a class="brand" href="/"><img class="brand__mark" src="/favicon.svg" alt="" width="28" height="28" />課堂搶答</a>
        <span class="topbar__role">學生端</span>
        <a class="topbar__link" href="/">回首頁</a>
      </div>
    </header>
    <div class="page">
      <div class="page-header">
        <h1>學生</h1>
      </div>
      <main id="app">
        <p id="student-status" class="status" role="status">正在載入組別工作階段…</p>
        <button id="student-leave" type="button" hidden>退出目前活動</button>
        <form id="student-join" class="panel" hidden>
          <label for="student-join-code">活動加入碼</label>
          <input id="student-join-code" class="code-input" autocomplete="off" required />
          <label for="student-name">組名</label>
          <input id="student-name" autocomplete="off" required />
          <button type="submit">加入活動</button>
        </form>
        <section id="student-mode" class="panel" hidden></section>
        <section id="student-buzzer" class="panel" hidden></section>
        <section id="student-results" class="panel" hidden></section>
      </main>
    </div>
    <script type="module" src="/student/mode-info.js"></script>
    <script type="module" src="/student/realtime-buzzer.js"></script>
    <script type="module" src="/student/results-export.js"></script>
    <script type="module" src="/student/activity-groups.js"></script>
  </body>
</html>
