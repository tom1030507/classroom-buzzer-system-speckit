<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>老師 — 課堂搶答系統</title>
    <link rel="stylesheet" href="/css/base.css" />
  </head>
  <body>
    <div class="page">
      <header class="page-header">
        <h1>老師</h1>
        <a href="/">回首頁</a>
      </header>
      <main id="app">
        <p id="teacher-status" class="status" role="status">正在載入教師工作階段…</p>
        <form id="teacher-login" hidden>
          <label for="teacher-password">教師密碼</label>
          <input id="teacher-password" type="password" autocomplete="current-password" required />
          <button type="submit">登入</button>
        </form>
        <section id="teacher-activities" hidden aria-label="活動管理">
          <div class="actions">
            <button id="create-activity" type="button">建立新活動</button>
            <button id="teacher-logout" type="button">登出</button>
          </div>
          <section id="teacher-activity" hidden aria-label="目前活動">
            <p>學生加入碼 <strong id="join-code"></strong></p>
            <h2>已加入的組別</h2>
            <button id="refresh-groups" type="button">重新載入組別</button>
            <ul id="teacher-groups"></ul>
            <section id="mode-select" hidden></section>
            <section id="sheets-import" hidden></section>
            <section id="teacher-buzzer" hidden></section>
            <section id="results-export" hidden></section>
          </section>
        </section>
      </main>
    </div>
    <script type="module" src="/teacher/mode-select.js"></script>
    <script type="module" src="/teacher/sheets-import.js"></script>
    <script type="module" src="/teacher/realtime-buzzer.js"></script>
    <script type="module" src="/teacher/results-export.js"></script>
    <script type="module" src="/teacher/activity-groups.js"></script>
  </body>
</html>
